<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Katya's Day">
<meta name="theme-color" content="#FBF7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16141A" media="(prefers-color-scheme: dark)">
<title>Katya's Day</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#FBF7F4; --card:#FFFFFF; --ink:#211D26; --ink2:#6E6875; --ink3:#A9A3AF;
  --line:#ECE6E1; --accent:#D9667B; --accent2:#7A6FD6; --ok:#3FA27A; --warn:#E0723C;
  --chip:#F3EEEA; --shadow:0 1px 2px rgba(40,20,30,.06),0 4px 14px rgba(40,20,30,.05);
  --tr:#D9364A; --ru:#3A6BD1;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16141A; --card:#221F27; --ink:#F2EEF4; --ink2:#A8A1AE; --ink3:#6C6572;
    --line:#2F2B35; --chip:#2B2731; --shadow:none; --accent:#EE8597; --accent2:#9C93F0; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  padding:calc(var(--sat) + 10px) 16px 8px;display:flex;align-items:center;gap:10px}
.top h1{flex:1;margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.iconbtn{width:38px;height:38px;border-radius:19px;background:var(--chip);display:grid;place-items:center;font-size:13px;font-weight:700}
.iconbtn svg{width:20px;height:20px}
main{padding:4px 16px calc(var(--sab) + 110px)}
.sub{color:var(--ink2);font-size:15px;margin:-2px 0 12px}
.sub::first-letter,.cap::first-letter{text-transform:uppercase}
.sec{margin:18px 0 6px;font-size:13px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.sec .n{background:var(--chip);border-radius:9px;padding:1px 7px;font-size:12px}
.sec.warn{color:var(--warn)}
.list{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:52px}
.row:last-child{border-bottom:0}
.chk{flex:0 0 26px;height:26px;border-radius:13px;border:2px solid var(--c,var(--ink3));display:grid;place-items:center;margin-top:1px}
.chk.on{background:var(--c,var(--ok))}
.chk.on::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.rbody{flex:1;min-width:0}
.rt{font-size:16px;word-wrap:break-word}
.done .rt{color:var(--ink3);text-decoration:line-through}
.ghost{opacity:.55}
.rm{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12.5px;color:var(--ink2);align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--c)}
.prio{color:var(--warn);font-weight:800}
.late{color:var(--warn);font-weight:600}
.empty{text-align:center;color:var(--ink3);padding:26px 10px;font-size:15px}
.hols{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.hol{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:14.5px}
.hol .fl{font-size:16px}
.hol .nm{flex:1}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.badge.off{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.soon{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.hchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.hchip{font-size:12px;padding:2px 8px;border-radius:9px;background:var(--chip);color:var(--ink2)}
.hchip.off{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);font-weight:600}
.dayh{display:flex;align-items:baseline;gap:8px;margin:18px 2px 6px}
.dayh b{font-size:17px}
.dayh b::first-letter{text-transform:uppercase}
.dayh b{display:inline-block}
.dayh span{color:var(--ink2);font-size:14px}
.dayh.today b{color:var(--accent)}
.dayh .plus{margin-left:auto;color:var(--accent);font-size:24px;line-height:1;padding:0 4px}
.weeknav{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.weeknav .lbl.cap{display:block}
.weeknav .lbl{flex:1;text-align:center;font-weight:600;color:var(--ink2);font-size:15px}
.pill{padding:7px 12px;border-radius:16px;background:var(--chip);font-size:14px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg)}
.scroller{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.search{width:100%;padding:10px 14px;border-radius:12px;border:0;background:var(--chip);margin:6px 0 8px;outline:none}
.fab{position:fixed;right:18px;bottom:calc(var(--sab) + 78px);width:58px;height:58px;border-radius:29px;
  background:var(--accent);color:#fff;font-size:32px;font-weight:300;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent);z-index:25;display:grid;place-items:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  padding:6px 4px calc(var(--sab) + 4px);background:color-mix(in srgb,var(--card) 90%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink3);padding:4px 0}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--accent)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.card{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.card .k{font-size:12.5px;color:var(--ink2)}
.card .v{font-size:22px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.card .v.ok{color:var(--ok)} .card .v.warn{color:var(--warn)}
.stu{display:flex;gap:12px;align-items:center}
.ava{flex:0 0 40px;height:40px;border-radius:20px;background:color-mix(in srgb,var(--accent2) 20%,transparent);color:var(--accent2);display:grid;place-items:center;font-weight:800}
.mini{display:flex;gap:6px;margin-left:auto}
.mini a,.mini button{width:34px;height:34px;border-radius:17px;background:var(--chip);display:grid;place-items:center;text-decoration:none;font-size:15px}
.lstat{display:flex;gap:6px;margin-top:6px}
.tbtn{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:10px;background:var(--chip);color:var(--ink2)}
.tbtn.on.held{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tbtn.on.paid{background:color-mix(in srgb,var(--accent2) 20%,transparent);color:var(--accent2)}
.tbtn.cx{color:var(--ink3);text-decoration:line-through}
.addbtn{display:block;width:100%;margin:10px 0;padding:13px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);color:var(--accent);font-weight:700;text-align:center}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(10,5,15,.38);z-index:50;opacity:0;transition:opacity .2s}
.sheetbg.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:20px 20px 0 0;
  max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(var(--sab) + 18px);
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.shead{display:flex;align-items:center;margin-bottom:10px}
.shead h2{flex:1;margin:0;font-size:20px;text-align:center}
.shead button{color:var(--accent);font-weight:600;min-width:70px;padding:6px 0}
.shead button:first-child{text-align:left;color:var(--ink2);font-weight:400}
.shead button:last-child{text-align:right}
.fgroup{background:var(--card);border-radius:14px;margin:10px 0;overflow:hidden;box-shadow:var(--shadow)}
.f{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);min-height:48px}
.f:last-child{border-bottom:0}
.f label{flex:0 0 auto;color:var(--ink2);font-size:15px}
.f input,.f select,.f textarea{flex:1;border:0;background:none;outline:none;text-align:right;min-width:0;-webkit-appearance:none;appearance:none}
.f input.sw{flex:0 0 51px;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;transition:background .2s;cursor:pointer}
.f input.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.f input.sw:checked{background:var(--ok)}
.f input.sw:checked::after{transform:translateX(20px)}
.f label{flex:1}
.f textarea{text-align:left;resize:none;min-height:64px}
.f input.big{font-size:18px;text-align:left}
.f.col{flex-direction:column;align-items:stretch}
.catpick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
.catpick button{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:16px;background:var(--chip);font-size:14px}
.catpick button.on{background:var(--c);color:#fff}
.catpick button.on .dot{background:#fff}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:2px;gap:2px;flex:1}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dows{display:flex;gap:5px;padding:0 12px 12px}
.dows button{flex:1;padding:8px 0;border-radius:9px;background:var(--chip);font-size:13px;font-weight:600;color:var(--ink2)}
.dows button.on{background:var(--accent);color:#fff}
.danger{display:block;width:100%;padding:13px;border-radius:14px;background:var(--card);color:#E0454F;font-weight:600;margin-top:14px;box-shadow:var(--shadow)}
.note{font-size:13px;color:var(--ink2);padding:4px 6px;line-height:1.45}
.slot{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.slot select,.slot input{flex:1;padding:8px;border-radius:9px;border:0;background:var(--chip);text-align:left}
.slot button{color:#E0454F;font-size:20px;padding:0 6px}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:26px;height:26px;border-radius:13px;background:var(--c);border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.rb{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px}
.rb.on{display:flex}
.login{max-width:420px;margin:30px auto 0}
.login h2{margin:0 0 6px;font-size:24px}
.login p{color:var(--ink2);font-size:14.5px;margin:0 0 14px;line-height:1.45}
.err{color:#E0454F;font-size:14px;margin:6px 4px}
.primary{display:block;width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;margin-top:12px;text-align:center}
.ghostbtn{display:block;width:100%;padding:12px;margin-top:8px;color:var(--ink2);text-align:center}
.mic{flex:0 0 36px;height:36px;border-radius:18px;background:var(--chip);font-size:17px;display:grid;place-items:center}
.mic.rec{background:var(--accent);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.rq{display:flex;gap:10px;align-items:flex-start}
.st{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:8px;white-space:nowrap}
.st.bekliyor{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st.onay{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.st.red{background:color-mix(in srgb,#E0454F 15%,transparent);color:#E0454F}
.actrow{display:flex;gap:8px;margin-top:10px}
.actrow button{flex:1;padding:12px 6px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:14.5px;color:var(--accent2)}
.famadd{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);margin:8px 0}
.famadd input{flex:1;border:0;background:none;outline:none;min-width:0}
.famadd .addb{width:36px;height:36px;border-radius:18px;background:var(--accent);color:#fff;font-size:22px}
.xbtn{color:var(--ink3);font-size:20px;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 150px);transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast button{color:var(--accent);font-weight:700;margin-left:10px;pointer-events:auto}
</style>
</head>

function toggleTask(id){
  const tk=S.tasks.find(x=>x.id===id);if(!tk)return;
  if(tk.done){tk.done=false;delete tk.doneAt;save();render();return}
  const nd=tk.rep&&tk.rep.t!=='none'&&tk.date?nextDate(tk,tk.date):null;
  if(nd){
    const copy=Object.assign({},tk,{id:uid(),done:true,doneAt:Date.now(),rep:{t:'none'},fromRep:tk.id});
    S.tasks.push(copy);const prev=tk.date;tk.date=nd;
    lastUndo=()=>{tk.date=prev;S.tasks=S.tasks.filter(x=>x.id!==copy.id)};
  } else {tk.done=true;tk.doneAt=Date.now();lastUndo=()=>{tk.done=false;delete tk.doneAt}}
  save();render();toast('✓ '+t('taskDone'),true);
}
function ghostsInRange(a,b){ // projected occurrences of repeating tasks
  const out=[];
  for(const tk of S.tasks){ if(tk.done||!tk.date||!tk.rep||tk.rep.t==='none')continue;
    let d=tk.date,g=0;while(g++<400){d=nextDate(tk,d);if(!d||d>b)break;if(d>=a)out.push({tk,d})}}
  return out;
}
function taskRow(tk,opts={}){
  const c=cat(tk.cat),td=today();
  const late=!tk.done&&tk.date&&tk.date<td;
  const meta=[];
  if(opts.showDate&&tk.date)meta.push(`<span class="${late?'late':''}">${esc(tk.date===td?t('today'):tk.date===addD(td,1)?t('tomorrow'):fDay(tk.date))}</span>`);
  else if(late)meta.push(`<span class="late">${esc(fDay(tk.date))}</span>`);
  if(tk.time||tk.end)meta.push(`<span>🕑 ${esc((tk.time||'')+(tk.end?'–'+tk.end:''))}</span>`);
  meta.push(`<span class="tag" style="--c:${c.c}"><i class="dot"></i>${esc(catName(c))}</span>`);
  if(tk.rep&&tk.rep.t!=='none')meta.push('<span>🔁</span>');
  if(tk.notes)meta.push('<span>📝</span>');
  return `<div class="row ${tk.done?'done':''} ${opts.ghost?'ghost':''}" data-act="edit" data-id="${tk.id}">
    <button class="chk ${tk.done?'on':''}" style="--c:${c.c}" data-act="${opts.ghost?'edit':'toggle'}" data-id="${tk.id}" aria-label="done"></button>
    <div class="rbody"><div class="rt">${tk.prio?'<span class="prio">! </span>':''}${esc(tk.title)}</div><div class="rm">${meta.join('')}</div></div></div>`;
}
const byTime=(a,b)=>(a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0;

/* ================= lessons ================= */
const stu=id=>S.students.find(s=>s.id===id);
function ensureLessons(a,b){
  let ch=false;
  for(const s of S.students){ if(s.inactive||!s.slots)continue;
    let d=a>s.start?a:s.start;
    while(d<=b){const w=dow(d);
      for(const sl of s.slots){ if(+sl.dow!==w)continue;
        if(!S.lessons.some(l=>l.sid===s.id&&l.date===d&&l.slot===sl.k)){
          S.lessons.push({id:uid(),sid:s.id,date:d,time:sl.time,slot:sl.k,st:'planned',paid:false,price:+s.price||0});ch=true}}
      d=addD(d,1)}}
  if(ch)save();
}
function lessonsOn(d){return S.lessons.filter(l=>l.date===d&&stu(l.sid)).sort(byTime)}
function lessonRow(l){
  const s=stu(l.sid);const c=cat('tutor').c;
  return `<div class="row" data-act="lesson" data-id="${l.id}">
   <div class="ava" style="flex-basis:30px;height:30px;font-size:13px">${esc((s.name||'?')[0].toUpperCase())}</div>
   <div class="rbody"><div class="rt" style="${l.st==='cancelled'?'text-decoration:line-through;color:var(--ink3)':''}">📘 ${esc(s.name)}</div>
    <div class="rm">${l.time?`<span>🕑 ${esc(l.time)}</span>`:''}<span class="tag" style="--c:${c}"><i class="dot"></i>${esc(catName(cat('tutor')))}</span><span>${money(l.price)}</span></div>
    ${l.st==='cancelled'?'':`<div class="lstat"><button class="tbtn held ${l.st==='held'?'on':''}" data-act="lheld" data-id="${l.id}">✓ ${t('held')}</button>
    <button class="tbtn paid ${l.paid?'on':''}" data-act="lpaid" data-id="${l.id}">${S.cur} ${t('paid')}</button></div>`}
   </div></div>`;
}

function list(rows,emptyTxt){return rows.length?`<div class="list">${rows.join('')}</div>`:(emptyTxt?`<div class="list"><div class="empty">${emptyTxt}</div></div>`:'')}
function vToday(){
  const td=today();ensureLessons(td,td);
  let h=`<div class="sub">${esc(fLong(td))}</div>`;
  const hs=holsIn(td,td);
  if(hs.length)h+=`<div class="hols">${hs.map(x=>`<div class="hol"><span class="fl">${flag(x)}</span><span class="nm">${esc(hName(x))}</span>${isOff(x)?`<span class="badge off">${t('dayOff')}</span>`:x.half?`<span class="badge">${t('halfDay')}</span>`:''}</div>`).join('')}</div>`;
  const late=S.tasks.filter(x=>!x.done&&x.date&&x.date<td).sort((a,b)=>a.date<b.date?-1:1);
  if(late.length)h+=`<div class="sec warn">${t('overdue')} <span class="n">${late.length}</span></div>`+list(late.map(x=>taskRow(x)));
  const tt=S.tasks.filter(x=>x.date===td).sort((a,b)=>(a.done-b.done)||(b.prio||0)-(a.prio||0)||byTime(a,b));
  const ls=lessonsOn(td);
  h+=`<div class="sec">${t('today')}</div>`;
  const rows=[...tt.filter(x=>!x.done).map(x=>taskRow(x)),...ls.map(lessonRow),...tt.filter(x=>x.done).map(x=>taskRow(x))];
  h+=list(rows,t('nothingToday'));
  const tm=addD(td,1);ensureLessons(tm,tm);
  const tmr=[...S.tasks.filter(x=>x.date===tm&&!x.done).sort(byTime).map(x=>taskRow(x)),...lessonsOn(tm).map(lessonRow)];
  if(tmr.length)h+=`<div class="sec">${t('tomorrow')}</div>`+list(tmr);
  const up=holsIn(addD(td,1),addD(td,14));
  if(up.length)h+=`<div class="sec">${t('soon')}</div><div class="hols">${up.slice(0,5).map(x=>`<div class="hol" data-act="holtask" data-d="${x.d}" data-n="${esc(hName(x))}"><span class="fl">${flag(x)}</span><span class="nm">${esc(hName(x))}</span><span class="badge soon">${t('inDays')(diff(td,x.d))}</span></div>`).join('')}</div>`;
  return h;
}
function vWeek(){
  const td=today();if(!WEEK)WEEK=mon(td);const end=addD(WEEK,6);
  ensureLessons(WEEK,end);
  const gh=ghostsInRange(WEEK,end);const hs=holsIn(WEEK,end);
  let h=`<div class="weeknav"><button class="iconbtn" data-act="wprev">‹</button><div class="lbl">${esc(fmt(WEEK,{day:'numeric',month:'short'}))} – ${esc(fmt(end,{day:'numeric',month:'short'}))}</div>${WEEK!==mon(td)?`<button class="pill" data-act="wtoday">${t('today')}</button>`:''}<button class="iconbtn" data-act="wnext">›</button></div>`;
  for(let i=0;i<7;i++){const d=addD(WEEK,i);
    const dh=hs.filter(x=>x.d===d);
    const tk=S.tasks.filter(x=>x.date===d).sort((a,b)=>(a.done-b.done)||byTime(a,b));
    const g=gh.filter(x=>x.d===d).map(x=>Object.assign({},x.tk,{date:d,_g:1}));
    const rows=[...tk.filter(x=>!x.done).map(x=>taskRow(x)),...g.map(x=>taskRow(x,{ghost:1})),...lessonsOn(d).map(lessonRow),...tk.filter(x=>x.done).map(x=>taskRow(x))];
    h+=`<div class="dayh ${d===td?'today':''}"><b>${esc(fmt(d,{weekday:'long'}))}</b><span>${esc(fmt(d,{day:'numeric',month:'long'}))}</span><button class="plus" data-act="addon" data-d="${d}">+</button></div>`;
    if(dh.length)h+=`<div class="hchips" style="margin:0 0 6px">${dh.map(holChip).join('')}</div>`;
    h+=rows.length?list(rows):'';
  }
  return h;
}
function vAll(){
  const td=today();
  let h=`<input class="search" id="q" placeholder="${t('searchPh')}" value="${esc(Q)}" autocomplete="off">`;
  h+=`<div class="scroller">${[['active',t('active')],['overdue',t('overdue')],['nodate',t('noDate')],['done',t('done')],['family','👨‍👩‍👧 '+t('family')]].map(([k,l])=>`<button class="pill ${FILTER===k?'on':''}" data-act="filter" data-k="${k}">${l}</button>`).join('')}</div>`;
  if(FILTER==='family')return h+vFamily();

  if(FILTER==='nodate')L=L.filter(x=>!x.done&&!x.date);
  if(FILTER==='done')L=L.filter(x=>x.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  else L.sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:(a.date||'9999')>(b.date||'9999')?1:byTime(a,b));

function vLessons(){
  const td=today();if(!LMONTH)LMONTH=td.slice(0,7);

  const held=ML.filter(l=>l.st==='held');
  const earned=held.reduce((s,l)=>s+(+l.price||0),0);
  const paid=ML.filter(l=>l.paid).reduce((s,l)=>s+(+l.price||0),0);
  const unpaid=held.filter(l=>!l.paid).reduce((s,l)=>s+(+l.price||0),0);
  const mlabel=new Intl.DateTimeFormat(loc(),{month:'long',year:'numeric'}).format(P(a));

  h+=`<div class="sec">${t('students')} <span class="n">${S.students.length}</span></div>`;
  if(!S.students.length)h+=`<div class="list"><div class="empty">${t('noStudents')}</div></div>`;
  else h+=list(S.students.map(s=>{const sl=ML.filter(l=>l.sid===s.id);const debt=sl.filter(l=>l.st==='held'&&!l.paid).length;
    const sched=(s.slots||[]).map(x=>`${DOWS[S.lang][x.dow-1]} ${x.time}`).join(', ');
    const tel=(s.phone||'').replace(/[^\d+]/g,'');
    return `<div class="row stu" data-act="student" data-id="${s.id}" style="${s.inactive?'opacity:.5':''}"><div class="ava">${esc((s.name||'?')[0].toUpperCase())}</div>
     <div class="rbody"><div class="rt">${esc(s.name)}</div><div class="rm"><span>${esc(sched||'—')}</span><span>${money(+s.price||0)}</span>${debt?`<span class="late">${t('unpaid')}: ${debt}</span>`:''}</div></div>
     <div class="mini">${tel?`<a href="tel:${esc(tel)}" data-act="none">📞</a><a href="https://wa.me/${esc(tel.replace('+',''))}" target="_blank" data-act="none">💬</a>`:''}</div></div>`}));
  h+=`<button class="addbtn" data-act="newstudent">${t('addStudent')}</button>`;
  h+=`<div class="sec">${t('lessonsMonth')} <span class="n">${ML.filter(l=>l.st!=='cancelled').length}</span></div>`;
  const days=[...new Set(ML.map(l=>l.date))].sort();
  if(!days.length)h+=list([],t('nothing'));
  for(const d of days)h+=`<div class="dayh ${d===td?'today':''}"><b>${esc(fmt(d,{weekday:'short'}))}</b><span>${esc(fmt(d,{day:'numeric',month:'long'}))}</span></div>`+list(lessonsOn(d).map(lessonRow));
  h+=`<button class="addbtn" data-act="newlesson">${t('addLesson')}</button>`;
  return h;
}

  if(S.mydays.length){
    h+=`<div class="sec">${t('myDays')}</div>`+list(S.mydays.slice().sort((a,b)=>{const ya=`${a.md}`<td.slice(5)?1:0,yb=`${b.md}`<td.slice(5)?1:0;return ya-yb||(a.md<b.md?-1:1)}).map(m=>{

  }
  flush();
  return h;
}

/* ================= sheet ================= */
let sheetEl=null,bgEl=null;
function openSheet(html,mount){
  closeSheet(true);
  bgEl=document.createElement('div');bgEl.className='sheetbg';
  sheetEl=document.createElement('div');sheetEl.className='sheet';sheetEl.innerHTML='<div class="grab"></div>'+html;
  document.body.append(bgEl,sheetEl);
  bgEl.onclick=()=>closeSheet();
  requestAnimationFrame(()=>{bgEl.classList.add('show');sheetEl.classList.add('show')});
  document.getElementById('fab').style.display='none';
  if(mount)mount(sheetEl);
}
function closeSheet(now){
  const s=sheetEl,b=bgEl;if(!s)return;sheetEl=bgEl=null;
  if(now){s.remove();b.remove();return}
  s.classList.remove('show');b.classList.remove('show');setTimeout(()=>{s.remove();b.remove()},260);
  document.getElementById('fab').style.display='grid';
}
const head=(title,right)=>`<div class="shead"><button data-x="cancel">${t('cancel')}</button><h2>${esc(title)}</h2><button data-x="save">${right||t('save')}</button></div>`;

async function exportData(){
  const name=`katyas-day-backup-${today()}.json`;
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  try{const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function importData(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.v||!Array.isArray(d.tasks))throw 0;
    if(!confirm(S.lang==='ru'?'Заменить текущие данные копией?':'Replace current data with the backup?'))return;
    S=Object.assign(defaults(),d);S.syncTs=Date.now();save();cloudPush(true);closeSheet();render();toast(t('imported'))}catch(e){toast('⚠️ JSON')}};
  r.readAsText(file);
}


/* ================= notifications (FCM web push) + move-to-tomorrow ================= */
const VAPID='BBldOHzV4kFa76yVZGI-zbdARcvcM5CFayUasRfCzUYCFkizCdvdRDBLIlqyploZg3bI96z9_zkooQJ3e2Fy5MI';
const notifOK=()=>typeof Notification!=='undefined'&&'serviceWorker' in navigator&&'PushManager' in window;
const notifState=()=>!notifOK()?'na':Notification.permission==='denied'?'denied':(Notification.permission==='granted'&&localStorage.getItem('katya.notif')==='1')?'on':'off';
function notifBlock(){
  const st=notifState();
  const txt={na:t('notifNeedHome'),denied:t('notifDenied'),on:t('notifOn'),off:t('notifOff')}[st];
  return `<div class="sec">🔔 ${t('notif')}</div><div class="fgroup"><div class="f"><label style="font-size:13px;line-height:1.4">${esc(txt)}</label></div>
   ${st==='off'?`<div class="f"><button id="notifOn" type="button" style="color:var(--accent);font-weight:600;width:100%;text-align:left;padding:6px 0;touch-action:manipulation">${t('notifBtn')}</button></div>`:''}</div>`;
}
const withTO=(pr,ms,lbl)=>Promise.race([pr,new Promise((_,j)=>setTimeout(()=>j(new Error(lbl+' timeout')),ms))]);
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('script'));document.head.append(s)})}
let notifBusy=false;
async function notifEnable(ask){
  const say=m=>{if(ask)toast(m)};
  if(ask&&notifBusy)return;
  if(!notifOK()){say(t('notifNeedHome'));return}
  if(!CL.user){say(t('signIn'));return}
  const btn=document.getElementById('notifOn');
  if(ask)notifBusy=true;if(btn&&ask){btn.disabled=true;btn.textContent='⏳ …'}
  try{
    // izin isteği MUTLAKA dokunuşla aynı anda (iOS) — başka await'ten önce
    if(ask){const p=await Notification.requestPermission();if(p!=='granted'){say(t('notifDenied'));return}}
    else if(Notification.permission!=='granted')return;
    if(typeof firebase==='undefined')throw new Error('firebase');
    if(!firebase.messaging)await withTO(loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js'),15000,'sdk');
    let reg=await navigator.serviceWorker.getRegistration();
    if(!reg)reg=await navigator.serviceWorker.register('sw.js');
    reg=await withTO(navigator.serviceWorker.ready,15000,'sw');
    const token=await withTO(firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg}),25000,'token');
    if(!token)throw new Error('token empty');
    let h=0;for(let i=0;i<token.length;i++)h=((h*31)+token.charCodeAt(i))>>>0;
    await withTO(CL.db.collection('users').doc(CL.user.uid).collection('cihaz').doc('c'+h.toString(36)).set({token,ua:navigator.userAgent.slice(0,160),tur:'telefon',app:'katya',ts:Date.now()}),15000,'save');
    try{localStorage.setItem('katya.notif','1')}catch(e){}
    say(t('notifOk'));
  }catch(e){say('⚠️ '+(e.code||e.message||e));try{console.warn('notif',e)}catch(_){}}
  finally{if(ask)notifBusy=false;if(ask&&sheetEl&&sheetEl.querySelector('#notifOn,#notifSt'))settingsSheet()}
}

function cloudInit(){

const stateRef=()=>CL.db.collection('users').doc(CL.user.uid).collection('katya').doc('state');
function mergeArr(remote,local){const ids=new Set((remote||[]).map(x=>x.id));return (remote||[]).concat((local||[]).filter(x=>!ids.has(x.id)))}
function cloudBind(u){
  CL.unsub.push(stateRef().onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(!snap.exists){cloudPush(true);return}
    const d=snap.data();let R;try{R=JSON.parse(d.json)}catch(e){return}
    if(!S.syncTs){ // ilk eşleşme bu cihazda: yerel + bulut birleşir
      const L=S;S=Object.assign(defaults(),R);
      for(const k of ['tasks','students','lessons','mydays','cats'])S[k]=mergeArr(R[k],L[k]);
      S.lang=L.lang;S.syncTs=d.ts||1;saveLocal();cloudPush(true);render();return;
    }
    if((d.ts||0)>S.syncTs&&d.dev!==DEV){S=Object.assign(defaults(),R);S.syncTs=d.ts;saveLocal();render()}
  },e=>{CL.err=e.code||String(e)}));
  CL.unsub.push(CL.db.collection(KUTU).where('from','==',u.uid).onSnapshot(s=>{
    const old=new Map(CL.reqs.map(r=>[r.id,r.durum]));
    CL.reqs=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.ts||0)-(a.ts||0));
    for(const r of CL.reqs){const o=old.get(r.id);if(o==='bekliyor'&&r.durum!=='bekliyor')toast((r.durum==='onay'?t('reqApproved'):t('reqRejected'))+r.baslik)}
    reqBadge();if(sheetEl&&sheetEl.dataset.k==='reqs')reqsSheet();
  },()=>{}));
  CL.unsub.push(CL.db.collection(KUTU).where('to','==',u.uid).onSnapshot(s=>{
    CL.inc=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.ts||0)-(a.ts||0));
    let seen={};const first=!localStorage.getItem('katya.incSeen');try{seen=JSON.parse(localStorage.getItem('katya.incSeen')||'{}')}catch(e){}
    const nw=CL.inc.filter(r=>r.durum==='bekliyor'&&!seen[r.id]);CL.inc.forEach(r=>seen[r.id]=1);
    try{localStorage.setItem('katya.incSeen',JSON.stringify(seen))}catch(e){}
    if(!first&&nw.length)toast(t('newFromMert')+nw[0].baslik);
    reqBadge();if(sheetEl&&sheetEl.dataset.k==='reqs')reqsSheet();
  },()=>{}));
  CL.unsub.push(CL.db.collection(ORTAK).onSnapshot(s=>{
    CL.fam=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.done-b.done)||((a.ts||0)-(b.ts||0)));
    if(VIEW==='all'&&FILTER==='family')render();
  },()=>{}));
}
function cloudPush(now){
  if(!CL.user)return;clearTimeout(CL.pushT);
  CL.pushT=setTimeout(()=>{S.syncTs=Date.now();saveLocal();
    stateRef().set({json:JSON.stringify(S),ts:S.syncTs,dev:DEV}).catch(e=>{CL.err=e.code||String(e)})},now?0:700);
}

/* ---------- takvim (.ics) ---------- */
function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,m=>'\\'+m)}
function addToCalendar(tk){
  if(!tk.date){toast(t('calNeedDate'));return}
  const d=tk.date.replace(/-/g,''),now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  let dt,alarm;
  if(tk.time){const[h,m]=tk.time.split(':').map(Number);const e=new Date(P(tk.date));if(tk.end){const[h2,m2]=tk.end.split(':').map(Number);e.setHours(h2,m2)}else e.setHours(h,m+60);
    const f=x=>`${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
    const st=new Date(P(tk.date));st.setHours(h,m);
    dt=`DTSTART;TZID=Europe/Istanbul:${f(st)}\r\nDTEND;TZID=Europe/Istanbul:${f(e)}`;alarm='-PT30M';}
  else{dt=`DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${addD(tk.date,1).replace(/-/g,'')}`;alarm='PT9H';}
  let rr='';const r=tk.rep||{};
  if(r.t==='daily')rr='RRULE:FREQ=DAILY\r\n';
  if(r.t==='weekly')rr='RRULE:FREQ=WEEKLY;BYDAY='+((r.days&&r.days.length?r.days:[dow(tk.date)]).map(x=>['MO','TU','WE','TH','FR','SA','SU'][x-1]).join(','))+'\r\n';
  if(r.t==='monthly')rr='RRULE:FREQ=MONTHLY\r\n';
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KatyasDay//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    `UID:${tk.id||uid()}@katyasday`,`DTSTAMP:${now}`,dt,`SUMMARY:${icsEsc(tk.title)}`,tk.notes?`DESCRIPTION:${icsEsc(tk.notes)}`:'',
    rr.trim(),'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(tk.title)}`,`TRIGGER${alarm.startsWith('-')?'':';RELATED=START'}:${alarm}`,'END:VALARM','END:VEVENT','END:VCALENDAR']
    .filter(Boolean).join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=(tk.title||'event').replace(/[^\wа-яА-ЯёЁ -]/g,'').slice(0,40)+'.ics';
  document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},4000);
}

let REC=null;
function bindMics(el){el.querySelectorAll('[data-mic]').forEach(b=>b.onclick=()=>dictate(el.querySelector('#'+b.dataset.mic),b))}
function dictate(input,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast(t('noVoice'));input&&input.focus();return}
  if(REC){try{REC.stop()}catch(e){}return}
  const r=new SR();REC=r;r.lang=S.lang==='ru'?'ru-RU':'en-US';r.interimResults=true;r.continuous=false;
  const base=input.value?input.value.trim()+' ':'';btn.classList.add('rec');toast(t('listening'));
  r.onresult=e=>{let txt='';for(const res of e.results)txt+=res[0].transcript;input.value=base+txt;};
  r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')toast(t('noVoice'))};
  r.onend=()=>{REC=null;btn.classList.remove('rec');input.focus()};
  try{r.start()}catch(e){REC=null;btn.classList.remove('rec');toast(t('noVoice'))}
}
